[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ic2ai-panda-research"
version = "1.2.1"
description = "Selected Gaz seven-body Panda dynamics with independent model-validation evidence"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "casadi==3.7.2", "proxsuite==0.7.2"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["panda_dynamics"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["panda_closed_loop*"]
